# يبني ملف APK للتثبيت اليدوي على أندرويد.
# التشغيل: صفحة المستودع، ثم Actions، ثم Build Android APK، ثم Run workflow، واكتب عنوان الخادم.
# الملف الناتج في Artifacts أسفل صفحة التشغيل.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "عنوان الخادم، مثل https://zill.onrender.com"
        required: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: zill_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Check server address
        env:
          API_BASE: ${{ inputs.api_base }}
        run: |
          if ! printf '%s' "$API_BASE" | grep -Eq '^https?://[A-Za-z0-9.:-]+/?$'; then
            echo "عنوان الخادم غير صحيح: يجب أن يبدأ بـ https:// أو http:// ولا يحتوي مسافات" >&2
            exit 1
          fi

      - run: flutter pub get

      - run: flutter test

      - name: Build APK
        env:
          API_BASE: ${{ inputs.api_base }}
        run: flutter build apk --release --dart-define=API_BASE="${API_BASE%/}"

      - uses: actions/upload-artifact@v4
        with:
          name: zill-apk
          path: zill_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
