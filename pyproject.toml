[project]
name = "project"
version = "0.1.0"
description = "Zill: Baghdad urban heat analysis and tree-planting priorities"
readme = "README.md"
authors = [
    { name = "Mariam12", email = "167231604+Maam1227@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.7.50",
    "geemap>=0.37.2",
    "geopandas>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "bcrypt>=4.1.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
]

[project.scripts]
project = "project:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
